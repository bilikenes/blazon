[package]
name = "blazon-shell-menu"
version = "0.1.0"
description = "Blazon'un Windows 11 sağ tık menüsü komutu (IExplorerCommand)"
authors = ["Enes Bilik"]
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "blazon_shell_menu"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# src-tauri'den bağımsız derlenir.
[workspace]
